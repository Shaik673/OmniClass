version: '3.9'

# Development override — hot reload, exposed ports, no nginx
services:
  mongodb:
    image: mongo:7.0
    container_name: omniclass-mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - omniclass-dev

  redis:
    image: redis:7.2-alpine
    container_name: omniclass-redis-dev
    ports:
      - "6379:6379"
    networks:
      - omniclass-dev

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: omniclass-qdrant-dev
    ports:
      - "6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    networks:
      - omniclass-dev

volumes:
  mongo_dev_data:
  qdrant_dev_data:

networks:
  omniclass-dev:
    driver: bridge
