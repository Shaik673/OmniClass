version: '3.9'

services:
  # ─── Databases ────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: omniclass-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: omniclass
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - omniclass-net

  redis:
    image: redis:7.2-alpine
    container_name: omniclass-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - omniclass-net

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: omniclass-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - omniclass-net

  # ─── Application Services ─────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: omniclass-ai
    restart: unless-stopped
    env_file: ./ai-service/.env
    depends_on:
      - mongodb
      - redis
      - qdrant
    networks:
      - omniclass-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ai/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniclass-api
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - mongodb
      - redis
      - ai-service
    networks:
      - omniclass-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniclass-frontend
    restart: unless-stopped
    networks:
      - omniclass-net

  nginx:
    image: nginx:1.25-alpine
    container_name: omniclass-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - omniclass-net

volumes:
  mongo_data:
  redis_data:
  qdrant_data:

networks:
  omniclass-net:
    driver: bridge
