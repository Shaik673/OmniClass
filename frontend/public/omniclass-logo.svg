<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="ocGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="ocGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield / Rounded Hexagon -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#ocGrad)" />
  <rect x="10" y="10" width="100" height="100" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Academic Mortarboard Geometric Cap -->
  <path d="M60 28 L94 44 L60 60 L26 44 Z" fill="#ffffff" filter="url(#ocGlow)" />
  <!-- Lower Cap Body -->
  <path d="M38 52 L38 68 C38 78 82 78 82 68 L82 52 L60 63 Z" fill="rgba(255,255,255,0.85)" />
  
  <!-- Compass Star / Knowledge Spark -->
  <circle cx="60" cy="44" r="3.5" fill="url(#ocGold)" />
  <path d="M60 76 L62.5 86 L72 88.5 L62.5 91 L60 100 L57.5 91 L48 88.5 L57.5 86 Z" fill="url(#ocGold)" />
  
  <!-- Golden Tassel -->
  <path d="M84 45 C86 52 89 60 89 66" fill="none" stroke="url(#ocGold)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="89" cy="67" r="2.5" fill="url(#ocGold)" />
</svg>

